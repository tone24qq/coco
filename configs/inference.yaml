modules:
  enabled:
    logic_rule: true
    pattern_model: true
    prior_model: true
    directional_consistency: true
    line_consistency: true
    global_assignment_prior: true
    pairwise_conditional_consistency: true
    focus_score: true
    connectivity_heatmap: true
    difference_trend: true
    skip_patterns: true
    mirror_sequences: true
    tail_analyzer: true
  weights:
    logic_rule: 0.24
    pattern_model: 0.16
    prior_model: 0.12
    directional_consistency: 0.2
    line_consistency: 0.18
    global_assignment_prior: 0.1
    pairwise_conditional_consistency: 0.05
    focus_score: 0.06
    connectivity_heatmap: 0.08
    difference_trend: 0.06
    skip_patterns: 0.05
    mirror_sequences: 0.04
    tail_analyzer: 0.04
  settings:
    global_assignment_prior:
      assignment_mode: greedy
      top_m_candidates: 4
      exact_max_candidates: 20
    pairwise_conditional_consistency:
      anchor_top_k_cells: 5
      anchor_top_k_values: 5
      max_pair_trials_per_candidate: 20
      runtime_mode: fast
      candidate_top_n: 8
      global_assignment_mode: greedy
      global_assignment_top_m_candidates: 4
      gating_enabled: true
      contradiction_penalty_weight: 1.0
      hard_violation_threshold: 2.0
      hard_gate_multiplier: 0.05
      soft_gate_floor: 0.25
      submodule_weights:
        logic_rule: 0.35
        directional_consistency: 0.25
        line_consistency: 0.25
        global_assignment_prior: 0.15
    logic_rule:
      fast_enabled: true
    prior_model:
      fast_enabled: true
    directional_consistency:
      fast_enabled: true
    line_consistency:
      fast_enabled: true
    focus_score:
      window_size: 3
    connectivity_heatmap:
      decay: inverse_distance
      decay_gamma: 0.35
    tail_analyzer:
      window_size: 3
  aggregator:
    type: gate_then_weighted_sum
    normalization_mode: light
    fusion_mode: weighted_plus_vote_with_gate
    vote_alpha: 0.12
    vote_top1_weight: 1.0
    vote_top3_weight: 0.7
    vote_rrf_weight: 0.8
    vote_borda_weight: 0.6
    vote_rrf_k: 10
    gating_enabled: true
    contradiction_penalty_weight: 1.0
    hard_violation_threshold: 2.0
    hard_gate_multiplier: 0.05
    soft_gate_floor: 0.25
    score_spread_enabled: true
    score_spread_temperature: 0.2
    elimination_version: v2

joint_assignment:
  enabled: true
  assignment_mode: exact
  contradiction_alpha: 0.35
  gate_beta: 0.2
  dedup_enabled: true
  top_k_per_target: 10
  version: v1

fast_path:
  enabled: true
  runtime_mode: fast
  use_numba: true
  use_parallel: false
  pairwise_candidate_top_n: 8
  global_assignment_top_m_candidates: 4
  exact_max_candidates: 20
  details_top_k: 10
