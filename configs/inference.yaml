modules:
  enabled:
    logic_rule: true
    pattern_model: true
    prior_model: false
    structural_consistency: true
    focus_score: true
    connectivity_heatmap: true
    difference_trend: true
    skip_patterns: true
    mirror_sequences: true
    tail_analyzer: true
    neighborhood_association: true
    local_arithmetic_relation: true
  weights:
    logic_rule: 0.20
    pattern_model: 0.04
    prior_model: 0.0
    structural_consistency: 0.26
    focus_score: 0.04
    connectivity_heatmap: 0.03
    difference_trend: 0.08
    skip_patterns: 0.07
    mirror_sequences: 0.02
    tail_analyzer: 0.03
    neighborhood_association: 0.04
    local_arithmetic_relation: 0.07
  settings:
    global_assignment_prior:
      assignment_mode: greedy
      top_m_candidates: 4
      exact_max_candidates: 20
    pairwise_conditional_consistency:
      anchor_top_k_cells: 5
      anchor_top_k_values: 5
      max_pair_trials_per_candidate: 20
      runtime_mode: fast
      candidate_top_n: 8
      pairwise_seed_top_n: 8
      pairwise_seed_modules:
        - __all_enabled_modules__
      global_assignment_mode: greedy
      global_assignment_top_m_candidates: 4
      gating_enabled: true
      contradiction_penalty_weight: 1.0
      hard_violation_threshold: 2.0
      hard_gate_multiplier: 0.05
      soft_gate_floor: 0.25
      submodule_weights:
        logic_rule: 0.35
        directional_consistency: 0.25
        line_consistency: 0.25
        global_assignment_prior: 0.15
    logic_rule:
      fast_enabled: true
    prior_model:
      fast_enabled: true
    local_arithmetic_relation:
      near_value_deltas: [1, 2, 3, 5, 8, 10, 20]
      exact_near_deltas: [1, 2, 3]
      medium_near_deltas: [5, 8, 10]
      weak_score_floor: 0.52
    directional_consistency:
      fast_enabled: true
    line_consistency:
      fast_enabled: true
    focus_score:
      window_size: 3
    connectivity_heatmap:
      decay: inverse_distance
      decay_gamma: 0.35
    tail_analyzer:
      window_size: 3
    stage2_adjustments:
      global_assignment_enabled: true
      pairwise_enabled: true
      assignment_delta_scale: 0.08
      assignment_penalty_scale: 0.08
      pairwise_delta_scale: 0.06
      pairwise_penalty_scale: 0.06
    neighborhood_association:
      radius: 1
      use_diagonal: true
      min_seed_count: 1
      decay_by_distance: true
      distance_decay_power: 1.0
      enabled_seed_families:
        - same_decade
        - near_value
      near_value_deltas: [1, 2, 10, 20]
      enabled_neighbor_families:
        - same_decade
        - near_value
      neighbor_value_deltas: [1, 2, 10, 20]
      score_mode: weighted_pattern_overlap
      seed_aggregation: mean
      candidate_aggregation: mean
      neutral_score_when_no_seed: 0.5
      floor_score: 0.0
      ceil_score: 1.0
      relation_source: heuristic_family_profile_v1
  aggregator:
    type: committee_weighted_sum
    weighting_mode: yaml_normalized
    allow_abstain: true
    preserve_diagnostics: true
    spatial_postprocess:
      enabled: false
      method: spatial_penalty
      distance_metric: hybrid
      top_m: 5
      penalty_d1: 0.10
      penalty_d2: 0.04
      score_gap_gate: 0.06
      mmr_lambda: 0.35
      mmr_distance_scale: 0.08
      mmr_d2_weight: 0.5
      protect_target_sensitive_threshold: 0.65
      protect_structure_threshold: 0.62
      protect_adjustment_threshold: 0.03
      protect_multiplier: 0.5
      max_penalty_per_candidate: 0.08
    tie_break_order:
      - target_sensitive_score
      - support_score
      - row_col_stable
    diagnostics:
      include_vote_features: true
      include_rank_features: true
      include_score_features: true
    judge:
      enabled: true
      use_for_primary_ranking: false
      artifact_path: artifacts/competitive_judge_artifact.json

joint_assignment:
  enabled: true
  assignment_mode: exact
  contradiction_alpha: 0.35
  gate_beta: 0.2
  dedup_enabled: true
  top_k_per_target: 10
  version: v1

fast_path:
  enabled: true
  runtime_mode: fast
  use_numba: true
  use_parallel: false
  pairwise_candidate_top_n: 8
  global_assignment_top_m_candidates: 4
  exact_max_candidates: 20
  details_top_k: 10

trained_ranker:
  enabled: true
  strict_missing_artifact: true
  model_registry_path: artifacts/model_registry.json
  apply_heuristic_rerank_after_model: true
