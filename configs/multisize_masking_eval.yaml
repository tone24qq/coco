data:
  repo_root: .
  annotation_manifest: samples/data/image_board_annotations.json
  parsed_boards_output: reports/parsed_boards.json

parser:
  min_confidence: 0.25
  use_cached_first: true

eval:
  folds: 3
  masking_repeats: 8
  seed: 2026
  min_samples_per_size: 2
  target_sizes: [120, 160]
  max_boards_per_size: 4
  synthetic_fallback_when_empty: true
  synthetic_boards_per_size: 6

search:
  n_trials: 16

modules:
  - focus
  - connectivity
  - heatmap
  - a2
  - d3
  - skip
  - diff
  - mirror
  - tail
  - f10

discovery:
  repeats: 4
  n_trials: 8
  candidate_modules:
    - local_arith_completion
    - local_delta_consistency
    - mirror_agreement
    - directional_pattern_agreement
    - modulo_family
    - rank_gap_repair
    - neighborhood_uniqueness_pressure
    - a2_delta
    - d3_delta
    - f10_repair_delta

reports:
  manifest: reports/board_manifest.json
  parse_audit: reports/parse_audit.json
  pending_annotations: reports/pending_annotations.json
  pending_review: reports/pending_review.json
  data_audit: reports/data_audit.json
  per_size_summary: reports/per_size_summary.json
  overall_summary: reports/overall_summary.json
  top10_summary: reports/top10_summary.json
  per_target_predictions: reports/per_target_predictions.csv
  module_leaderboard: reports/module_leaderboard.json
  module_discovery_summary: reports/module_discovery_summary.json
  error_cases_top10: reports/error_cases_top10.json
  search_trials: reports/search_trials.json
  best_config: reports/best_config.json
