train:
  models_dir: models

features:
  min_history: 100
  min_dynamic_n: 20
  max_dynamic_n: 999
  top_k: 50

validation:
  n_splits: 3
  min_train_issues: 30

retrieval:
  top_k: 50
  require_same_length_window: true
  prefer_same_day_progress: true
  weights:
    aligned_overlap: 0.30
    recency_aligned_overlap: 0.20
    freq_similarity: 0.15
    profile_similarity: 0.10
    exact_draw_match: 0.15
    same_day_progress_bonus: 0.10

runtime_scoring:
  weights:
    ranker: 0.40
    logistic: 0.15
    retrieval: 0.30
    history_prior: 0.10
    analysis: 0.03
    local_peak: 0.02
