feature_version: v3_core20
training_mode: ranker_main
pipeline:
  version: cascade_v1
  stage1_keep: 30
  stage2_keep: 10
  artifact_dir: models/cascade_v1
max_draws_for_training: 3200
feature_min_history: 22
core_windows:
  z_window: 50
  freq_short: 20
  freq_long: 200
  pmi_window: 200
  handoff_window: 200
smoothing_alpha: 0.5
decay_half_lives:
  ewma: 50
  recent_hit: 5
  neighbor: 10
distance_kernel_tau: 2
backtest_splits: 5
research_backtest_splits: 3
research_iterations: 140
final_stage_versions: 2
backtest_max_draws: 1000
catboost_params:
  iterations: 300
  learning_rate: 0.05
  depth: 8
  l2_leaf_reg: 3.0
  loss_function: Logloss
  eval_metric: Logloss
  random_seed: 42
  allow_writing_files: false
  verbose: false
overfit_thresholds:
  train_vs_oos_gap: 0.03
  fold_dispersion: 0.05
  regime_dispersion: 0.06
acceptance_thresholds:
  non_degradation_tol: 0.01
  stability_improvement_min: 0.0
soft_label_training:
  enabled: false
  pm1_weight: 0.35
  pm2_weight: 0.15
  blend_weight: 0.15
  normalization: rank_pct
proximity_model:
  enabled: false
  pm1_weight: 0.12
ranking_experiment:
  enabled: true
  objective: QuerySoftMax
  eval_metric: NDCG:top=10
  custom_metrics:
    - NDCG:top=3
    - NDCG:top=10
    - PrecisionAt:top=3
    - PrecisionAt:top=10
    - RecallAt:top=3
    - RecallAt:top=10
ranking_pairwise_experiment:
  enabled: false
  objective: PairLogitPairwise
