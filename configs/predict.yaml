feature_min_history: 22
pipeline:
  # precedence:
  # 1) pipeline.version != auto => force pipeline by config
  # 2) else use models/strategy_config.json selected_strategy
  # 3) fallback to models/metadata.json selected/fallback strategy
  version: auto
  artifact_dir: models/cascade_v1
  stage1_keep: 30
  stage2_keep: 10
  include_stage_details_default: false
min_recent_draws: 1
max_recent_draws: 3000
fetch_timeout_seconds: 8
fetch_retries: 2
fetch_retry_backoff_seconds: 0.5
auto_fetch_sources:
  - https://winwin.tw/Bingo
  - https://www.pilio.idv.tw/bingo/list.asp
  - https://www.taiwanlottery.com.tw/lotto/bingobingo/history.aspx
