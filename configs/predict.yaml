feature_min_history: 22
pipeline:
  version: auto
  artifact_dir: models/cascade_v1
  stage1_keep: 30
  stage2_keep: 10
  include_stage_details_default: false
min_recent_draws: 1
max_recent_draws: 3000
fetch_timeout_seconds: 8
fetch_retries: 2
fetch_retry_backoff_seconds: 0.5
auto_fetch_sources:
- https://winwin.tw/Bingo
- https://www.pilio.idv.tw/bingo/list.asp
- https://www.taiwanlottery.com.tw/lotto/bingobingo/history.aspx
neighbor_peak_correction:
  enabled: true
  alpha_pm1: 0.2
  alpha_pm2: 0.08
topk_group_dedup:
  enabled: true
  group_distance: 1
  apply_to_top3_only: true
  candidate_pool_for_grouping: 20
soft_label_training:
  enabled: false
  pm1_weight: 0.35
  pm2_weight: 0.15
  blend_weight: 0.15
  normalization: rank_pct
proximity_model:
  enabled: false
  pm1_weight: 0.12

ranking_experiment:
  enabled: true
  objective: QuerySoftMax
