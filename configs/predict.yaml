models:
  dir: models

auto_fetch:
  enabled: true
  sources:
    - https://winwin.tw/Bingo
    - https://lotto.auzo.tw/RK.php

history:
  dynamic_context: true
  min_dynamic_n: 20
  max_dynamic_n: 999
  processed_path: data/processed/history_processed.csv
  prefer_same_day_progress: true

provenance:
  raw_dirs:
    - data/raw
    - raw
  audit_path: reports/local_data_audit.json
  manifest_path: reports/raw_manifest.json
  consensus_report_path: reports/source_consensus_report.json

snapshot:
  enabled: true
  path: reports/history_snapshot.json

retrieval:
  top_k: 50
  require_same_length_window: true
  prefer_same_day_progress: true
  weights:
    aligned_overlap: 0.30
    recency_aligned_overlap: 0.20
    freq_similarity: 0.15
    profile_similarity: 0.10
    exact_draw_match: 0.15
    same_day_progress_bonus: 0.10

runtime_scoring:
  weights:
    ranker: 0.40
    logistic: 0.15
    retrieval: 0.30
    history_prior: 0.10
    analysis: 0.03
    local_peak: 0.02
  dynamic:
    enabled: true
    mode: heuristic_retrieval_gate_v1
    min_weights:
      ranker: 0.35
      logistic: 0.08
      retrieval: 0.10
    fixed_weights:
      history_prior: 0.10
      analysis: 0.03
      local_peak: 0.02
