model:
  name: DynamicMET
  num_fields: ${BOARD_ROWS}*${BOARD_COLS}
  num_values: ${MAX_VALUE}
  d_model: 256
  nhead: 8
  depth: 8
  dropout: 0.1

training:
  mask_ratio_range: [0.30, 0.70]
  batch_size: 64
  epochs: 20
  lr: 3e-4
  weight_decay: 0.0001
  label_smoothing: 0.1
  scheduler:
    type: cosine
    warmup_epochs: 2
  layerwise_lr_decay: 0.65

data:
  data_dir: ./data_archives
