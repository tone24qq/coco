# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'   # 每天 03:00 UTC（台灣 11:00）

env:
  PIP_CACHE_DIR: ~/.cache/pip
  FAST_TEST: "1"          # app.py 可讀此變數以縮短迭代次數
  # 若你要私有下載隱藏測資，請在 GitHub Settings → Secrets 加入 SECRET_ZIP_URL
  SECRET_ZIP_URL: ${{ secrets.SECRET_ZIP_URL }}

##############################################################################
# 1️⃣  Lint / Unit / Reliability / Quality Gate
##############################################################################
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt
          # CI 需要的額外工具
          pip install ruff mypy pytest hypothesis pytest-xdist pytest-cov vulture
          pip install .

      # ▒▒▒ 下載隱藏測資（若 SECRET_ZIP_URL 有設值） ▒▒▒
      - name: Download secret cases
        if: env.SECRET_ZIP_URL != ''
        run: |
          mkdir -p evaluation
          curl -sSL "$SECRET_ZIP_URL" -o evaluation/secret_cases.zip

      - name: Ruff & MyPy
        run: |
          ruff check .
          mypy . --strict

      - name: Weights smoke test
        run: |
          python - <<'PY'
import brain
want = {"gdiff": 0.4, "conn": 0.05}
got = {k: round(brain.AGG_WEIGHTS.get(k, 0.0), 2) for k in want}
assert got == want, f"weights mismatch {got}"
PY

      - name: Dead code scan
        run: |
          python dead_code_autorun.py --root .
          if [ $(wc -l < dead_code_report.md) -gt 6 ]; then
            cat dead_code_report.md
            exit 1
          fi

      # ▒▒▒ Quality Gate：命中率 ≥93%、單次 <100 ms ▒▒▒
      - name: Quality Gate
        run: |
          python quality_gate.py \
            --zip evaluation/secret_cases.zip \
            --n-random 1000

      - name: Run unit & quick tests
        run: |
          pytest -q -n auto -m "not slow" --cov=./ --cov-report=xml

      - name: Run convergence tests
        run: |
          pytest -q tests/test_reliable_accuracy.py

      - name: Run 1000-runs reliability test
        run: |
          pytest -q -m slow tests/test_reliability_1000.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

##############################################################################
# 2️⃣  Extended / Slow / Stress tests（排程或手動觸發才跑）
##############################################################################
  slow-and-stress:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest hypothesis

      - name: Run all slow tests
        run: |
          pytest -q -m slow --durations=20

      - name: Run infinite stress test
        run: |
          python - << 'EOF'
import tests.reliability_utils as ru
ru.run_infinite_test()
EOF