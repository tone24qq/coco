name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'  # 每天 03:00 UTC

env:
  PIP_CACHE_DIR: ~/.cache/pip
  FAST_TEST: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt
          pip install ruff mypy pytest hypothesis pytest-xdist pytest-cov

      - name: Ruff & MyPy
        run: |
          ruff check .
          mypy . --strict

      - name: Run unit + reliability tests
        run: |
          # 自動跑 tests/ 目錄下所有 test_*.py
          pytest -q -n auto --cov=./ --cov-report=xml

      - name: Run convergence tests (script)
        run: |
          # 如果你的 reliable_accuracy_test_suite.py 放在專案根目錄
          python reliable_accuracy_test_suite.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  property-tests:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest hypothesis
      - name: Run slow tests
        run: |
          pytest -q -m slow --durations=20

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: |
          echo "Deploying..."