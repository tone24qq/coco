# .github/workflows/ci.yml
name: CI

on:
  push:                # 任何分支推送時都跑
    branches: ['*']
  pull_request:        # 任何分支發起 PR、包括 Draft→Ready 都跑
    branches: ['*']
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch: {}      # 手動觸發
  schedule:                  # 定期排程跑一次壓力測
    - cron: '0 3 * * *'      # 每天 03:00 UTC（台灣 11:00）

env:
  PIP_CACHE_DIR: ~/.cache/pip
  FAST_TEST: "1"             # app.py 可讀取此變數以縮短迭代次數

jobs:

  ##############################################################################
  # 1️⃣  Lint & Unit + Reliability Tests（最關鍵；失敗就停）
  ##############################################################################
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt
          pip install ruff mypy pytest hypothesis pytest-xdist pytest-cov

      - name: Ruff & MyPy
        run: |
          ruff check .
          mypy . --strict

      - name: Run unit & quick tests
        run: |
          pytest -q -n auto -m "not slow" --cov=./ --cov-report=xml

      - name: Run reliability convergence tests
        run: |
          pytest -q tests/test_reliable_accuracy.py

      - name: Run 1000-runs reliability test
        run: |
          pytest -q -m slow tests/test_reliability_1000.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  ##############################################################################
  # 2️⃣  Extended / Slow / Stress tests（僅 schedule 或手動觸發時跑）
  ##############################################################################
  slow-and-stress:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest hypothesis

      - name: Run slow tests
        run: |
          pytest -q -m slow --durations=20

      - name: Run infinite stress test
        run: |
          # 如果你把 run_infinite_test 寫在 tests/reliability_utils.py
          python - << 'EOF'
import tests.reliability_utils as ru
ru.run_infinite_test()
EOF

  ##############################################################################
  # 3️⃣  Deploy to Render（合併到 main 且 PR Ready 時才觸發）
  ##############################################################################
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'ready_for_review' &&
       github.base_ref == 'main')
    steps:
      - name: Build container image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/sudoku-service:${{ github.sha }} .
      - name: Trigger Render deploy
        run: |
          curl -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys