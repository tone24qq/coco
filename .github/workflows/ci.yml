# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'  # 每天 03:00 UTC（台灣 11:00）

env:
  PIP_CACHE_DIR: ~/.cache/pip
  FAST_TEST: "1"  # app.py 可讀此變數以縮短迭代次數

jobs:

  ##############################################################################
  # 1️⃣ Lint & Unit + Reliability Tests（PR/Push 都跑；Fail Fast）
  ##############################################################################
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt
          pip install ruff mypy pytest hypothesis pytest-xdist pytest-cov

      - name: Ruff & MyPy
        run: |
          ruff check .
          mypy . --strict

      - name: Run unit & quick tests
        run: |
          pytest -q -n auto -m "not slow" --cov=./ --cov-report=xml

      - name: Run convergence tests
        run: |
          pytest -q tests/test_reliable_accuracy.py

      - name: Run 1000-runs reliability test
        run: |
          pytest -q -m slow tests/test_reliability_1000.py

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  ##############################################################################
  # 2️⃣ Extended / Slow / Stress tests（Schedule 或手動觸發時跑）
  ##############################################################################
  slow-and-stress:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest hypothesis

      - name: Run all slow tests
        run: |
          pytest -q -m slow --durations=20

      - name: Run infinite stress test
        run: |
          python - << 'EOF'
import tests.reliability_utils as ru
ru.run_infinite_test()
EOF