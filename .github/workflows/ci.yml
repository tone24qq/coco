name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: pip install -r requirements.txt
      - run: pip install mypy
      - run: black --check .
      - run: isort --check .
      - run: flake8
      - run: mypy . --ignore-missing-imports
      - run: python -m py_compile $(git ls-files '*.py')
      - run: pytest -q

  train-and-package:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: |
          BOARD_ROWS=8 BOARD_COLS=10 MAX_VALUE=80 python train.py --epochs 1
      - uses: actions/upload-artifact@v2
        with:
          name: model-checkpoints
          path: checkpoints/
