name: Train

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: pip install -r requirements.txt
      - run: |
          BOARD_ROWS=8 BOARD_COLS=10 MAX_VALUE=80 \
          python train.py --epochs 1
      - uses: actions/upload-artifact@v2
        with:
          name: model-checkpoints
          path: checkpoints/
